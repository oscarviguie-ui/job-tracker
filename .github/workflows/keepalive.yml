# Free Supabase projects pause after 7 days without API traffic. A tiny read twice a week keeps it awake.
name: keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' docs/config.js)
          KEY=$(grep -oP 'SUPABASE_KEY\s*=\s*"\K[^"]+' docs/config.js)
          curl -fsS "$URL/rest/v1/settings?select=id" -H "apikey: $KEY" -o /dev/null -w "%{http_code}\n"
